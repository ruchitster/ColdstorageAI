name: CI - Cold Storage E2E (Vercel + Render)

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Setup Node
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # Install frontend dependencies (Playwright lives here)
      # =========================
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      # =========================
      # Install Playwright browsers
      # =========================
      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      # =========================
      # Run E2E tests on LIVE environment
      # =========================
      - name: Run Playwright Tests (Vercel + Render)
        working-directory: ./frontend
        env:
          BASE_URL: https://coldstorage-ai.vercel.app
          API_URL: https://coldstorageai.onrender.com/api
          NODE_ENV: test
        run: npx playwright test

      # =========================
      # Upload report on failure
      # =========================
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
name: CI - Cold Storage (Smoke Test Gate)

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================
  # 1. SMOKE TEST (GATEKEEPER)
  # =========================
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run FULL SMOKE TEST
        working-directory: ./frontend
        env:
          BASE_URL: https://coldstorage-ai.vercel.app
          API_URL: https://coldstorageai.onrender.com/api
          NODE_ENV: test
        run: npx playwright test tests-e2e/ui/full-smoke.spec.js

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report


  # =========================
  # 2. DEPLOY TO VERCEL
  # =========================
  deploy-vercel:
    needs: smoke-tests
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

  # =========================
  # 3. DEPLOY TO RENDER
  # =========================
  deploy-render:
    needs: smoke-tests
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
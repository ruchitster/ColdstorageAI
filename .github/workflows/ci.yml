name: CI - Cold Storage (Smoke Test Gate)

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================
  # 1. SMOKE TEST (GATEKEEPER)
  # =========================
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      # Install Playwright browsers
      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      # RUN ONLY FULL SMOKE TEST
      - name: Run FULL SMOKE TEST
        working-directory: ./frontend
        env:
          BASE_URL: https://coldstorage-ai.vercel.app
          API_URL: https://coldstorageai.onrender.com/api
          NODE_ENV: test
        run: npx playwright test tests-e2e/smoke/full-smoke.spec.js

      # Upload report only if failed
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report


  # =========================
  # 2. DEPLOY JOB (ONLY IF TEST PASSES)
  # =========================
  deploy:
    needs: smoke-tests   # 👈 THIS IS THE GATE
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Info
        run: |
          echo "Smoke tests passed ✅"
          echo "Vercel + Render can deploy safely"

      - name: Trigger Vercel Deploy (if needed)
        run: echo "Handled automatically by Vercel Git integration"

      - name: Trigger Render Deploy (if needed)
        run: echo "Handled automatically by Render Git integration"